# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/groupbuying?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=jiusan87
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# 服务器配置
server.port=5000

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=D:/在线拼团/uploads
spring.servlet.multipart.location=D:/在线拼团/temp

# JWT配置
jwt.secret=your-secret-key
jwt.expiration=86400000

# 日志配置
logging.level.org.springframework.web=INFO
logging.level.com.groupbuying=DEBUG
logging.file.name=logs/application.log

# 静态资源配置
spring.web.resources.static-locations=classpath:/public/,file:${file.upload-dir}/ 